name: Deploy Memestone to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test game rules
        if: ${{ !contains(github.event.head_commit.message, '[connection-only]') && !contains(github.event.head_commit.message, '[editor-checks]') && !contains(github.event.head_commit.message, '[hero-effects]') && !contains(github.event.head_commit.message, '[class-decks]') && !contains(github.event.head_commit.message, '[storm-update]') && !contains(github.event.head_commit.message, '[cat-update]') && !contains(github.event.head_commit.message, '[card-update]') && !contains(github.event.head_commit.message, '[tigerra]') && !contains(github.event.head_commit.message, '[menu-only]') && !contains(github.event.head_commit.message, '[ui-update]') && !contains(github.event.head_commit.message, '[profile-update]') && !contains(github.event.head_commit.message, '[community-update]') }}
        run: npm test
      - name: Test editor, classes and room protocol
        if: ${{ contains(github.event.head_commit.message, '[editor-checks]') }}
        run: npm run test:editor
      - name: Test hero powers and spell targets
        if: ${{ contains(github.event.head_commit.message, '[hero-effects]') }}
        run: npm run test:hero-effects
      - name: Test class decks, warlock and rooms
        if: ${{ contains(github.event.head_commit.message, '[class-decks]') }}
        run: npm run test:decks
      - name: Test storm, class cards and large packs
        if: ${{ contains(github.event.head_commit.message, '[storm-update]') }}
        run: npm run test:storm
      - name: Test general cat and saved decks
        if: ${{ contains(github.event.head_commit.message, '[cat-update]') }}
        run: npm run test:cat
      - name: Test quests, class cards, stealth and bulky
        if: ${{ contains(github.event.head_commit.message, '[card-update]') }}
        run: npm run test:card-update
      - name: Test Tigerra battlecry and deathrattle
        if: ${{ contains(github.event.head_commit.message, '[tigerra]') }}
        run: npm run test:tigerra
      - name: Test cumulative match metrics and profile migration
        if: ${{ contains(github.event.head_commit.message, '[profile-update]') }}
        run: npm run test:profile
      - name: Test community installation and combat keywords
        if: ${{ contains(github.event.head_commit.message, '[community-update]') }}
        run: npm run test:community
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build the game for its Pages path
        run: npm run build -- --base "${PAGES_BASE_PATH}/"
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the game
        id: deployment
        uses: actions/deploy-pages@v4
